name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main] # build, test and audit every pull request; only pushes to main deploy
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # never cancel a production deploy half way

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the IndexNow step compares the last commit with the one before it
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:engine
      - run: npm run export:web
      - run: npm run audit # fails the build on SEO regressions (titles, canonicals, sitemap, app bundle)
      - name: Install Chromium for the browser tests
        run: npx playwright-core install --with-deps chromium
      - name: Browser tests (site checks and every tool, in a real browser)
        run: |
          node scripts/serve-dist.js dist 8080 &
          sleep 3
          node scripts/e2e-smoke.js
          node scripts/e2e-tools.js || node scripts/e2e-tools.js # the tools run OCR and downloads: allow one retry for a slow runner
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=iduckpdf --branch=main
      - name: Tell IndexNow engines (Bing and others) about the deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true # a failed ping must never fail a deploy
        run: node scripts/indexnow.js
      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, so the build passed but nothing was deployed. See docs/TODO.md section 3."
