name: Live health check

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC (off the hour on purpose: GitHub delays jobs queued at :00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the live site (no dependencies needed; exits 1 on any failure, which emails the repo owner)
        run: node scripts/health-check.js https://iduckpdf.com
