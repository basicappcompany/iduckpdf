<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iDuckPDF – UX preview</title>
<style>
:root{--bg:#fffdf5;--card:#fff;--ink:#17160f;--muted:#7a776a;--duck:#ffd23f;--duck2:#ff8a1f;--line:#17160f;--soft:#f3efe0;--r:14px;--sh:4px 4px 0 var(--ink);--ok:#1f9d55}
[data-theme=dark]{--bg:#121212;--card:#1c1c1e;--ink:#f5f5f5;--muted:#a1a1a6;--line:#f5f5f5;--soft:#26262a;--sh:4px 4px 0 #000;--ok:#4cd98a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
kbd{font:700 11px ui-monospace,Consolas,monospace;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;background:var(--card);color:var(--ink)}
.duck{color:var(--ink)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:2px solid var(--line);background:var(--card);padding:14px 12px 20px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.3rem;letter-spacing:-.5px;text-decoration:none;padding:4px 6px 10px}
.brand svg{width:34px;height:34px}
.sbtn{display:flex;align-items:center;gap:8px;width:100%;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;margin-bottom:8px;color:var(--muted);text-align:left;box-shadow:3px 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.sbtn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.sbtn span{flex:1}
.nav a.item,.cat summary{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:10px;text-decoration:none;font-weight:700;font-size:.95rem;cursor:pointer;list-style:none}
.cat summary::-webkit-details-marker{display:none}
.cat summary:after{content:"›";margin-left:auto;transition:transform .15s;color:var(--muted)}
.cat[open] summary:after{transform:rotate(90deg)}
.nav a.item:hover,.cat summary:hover{background:var(--soft)}
.nav a.on{background:var(--duck);color:#17160f}
.cat .tools{margin:2px 0 6px 14px;border-left:2px solid var(--soft);padding-left:6px}
.cat .tools a{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:8px;text-decoration:none;font-size:.88rem;font-weight:600;color:var(--ink)}
.cat .tools a:hover{background:var(--soft)}
.cat .tools a.on{background:var(--duck);color:#17160f}
.pill{margin-left:auto;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.pill.live{background:var(--ok);border-color:var(--ok);color:#fff}
.side h6{margin:10px 10px 2px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.crumb{color:var(--muted);font-size:.9rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--ink);text-decoration:underline}
.ibtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:700;box-shadow:3px 3px 0 var(--line)}
.ibtn:hover{background:var(--duck);color:#17160f}
.ibtn:active{transform:translate(2px,2px);box-shadow:none}
.burger{display:none}
.page{padding:28px 24px 60px;max-width:1040px;width:100%;margin:0 auto}
.foot{margin-top:auto;border-top:2px solid var(--line);padding:18px 24px;display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;justify-content:center}
.foot a{text-decoration:none}.foot a:hover{color:var(--ink);text-decoration:underline}

/* ---------- common bits ---------- */
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0 0 10px;letter-spacing:-1.5px}
h1 .hl{background:var(--duck);color:#17160f;padding:0 .2em;border-radius:10px;display:inline-block}
h2{font-size:1.5rem;letter-spacing:-.5px;margin:34px 0 12px}
.lead{color:var(--muted);font-size:1.1rem;max-width:62ch;margin:0 0 18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--duck);color:#17160f;border:2px solid var(--line);border-radius:var(--r);padding:11px 26px;font-weight:900;box-shadow:var(--sh);text-decoration:none;transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--card);font-size:.88rem;font-weight:700;text-decoration:none}
a.chip:hover{background:var(--duck);color:#17160f}
.trust{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 20px;color:var(--muted);font-size:.92rem;font-weight:700}
.trust span:before{content:"✓ ";color:var(--ok)}

/* ---------- home ---------- */
.hero{text-align:center;padding:20px 0 8px}
.hero .big{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.hero .big svg{width:92px;height:92px}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.heroBar{display:flex;gap:12px;align-items:center;max-width:620px;margin:22px auto 8px;padding:14px 18px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);cursor:text;color:var(--muted);text-align:left;width:100%}
.heroBar:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.heroBar span{flex:1;font-size:1.1rem}
.hint{color:var(--muted);font-size:.9rem}
.helper{display:flex;gap:16px;align-items:center;padding:18px 20px;margin-top:24px;background:var(--duck);color:#17160f}
.helper .em{font-size:2.4rem}
.helper h3{margin:0}.helper p{margin:0;opacity:.8}
.helper .btn{margin-left:auto;background:#17160f;color:#fff;box-shadow:3px 3px 0 #0006}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tool{display:block;padding:16px;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s;position:relative}
.tool:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:var(--duck);color:#17160f}
.tool:hover p{color:#3b3720}
.tool .ic{font-size:1.9rem;line-height:1}
.tool h3{margin:6px 0 2px;font-size:1.05rem}
.tool p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.35}
.tool .pill{position:absolute;top:12px;right:12px;margin:0}
.tool.sm{padding:12px 14px;display:flex;gap:10px;align-items:center}
.tool.sm h3{margin:0;font-size:.95rem}.tool.sm p{display:none}

/* ---------- tool page ---------- */
.upload{border:3px dashed var(--line);border-radius:18px;background:var(--card);padding:38px 20px;text-align:center;transition:.15s}
.upload.over,.upload:hover{background:var(--duck);color:#17160f}
.upload .btn{margin-top:10px;background:var(--card);color:var(--ink)}
.files{list-style:none;padding:0;margin:14px 0 0}
.files li{display:flex;gap:10px;align-items:center;padding:8px 12px;margin-bottom:8px;background:var(--card);border:2px solid var(--line);border-radius:10px}
.files li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files button{border:0;background:none;font-weight:900;padding:2px 8px;border-radius:6px}
.files button:hover{background:var(--duck);color:#17160f}
.opts{display:grid;gap:12px;margin:16px 0;padding:16px}
.opts label{display:grid;gap:4px;font-weight:800;font-size:.9rem}
.opts input,.opts select{padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400}
.opts input:focus,.opts select:focus{outline:none;box-shadow:3px 3px 0 var(--line)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:8px 18px;font-weight:800}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:var(--duck);color:#17160f}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;counter-reset:s}
.step{padding:16px;position:relative;counter-increment:s}
.step:before{content:counter(s);position:absolute;top:-14px;left:14px;width:30px;height:30px;border-radius:50%;background:var(--duck);color:#17160f;border:2px solid var(--line);display:grid;place-items:center;font-weight:900}
.step b{display:block;margin-top:6px}
.step p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
details.faq{border:2px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
details.faq summary{padding:12px 16px;font-weight:800;cursor:pointer;list-style:none;display:flex;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:after{content:"+";margin-left:auto;font-size:1.3rem;line-height:1}
details.faq[open] summary:after{content:"–"}
details.faq p{margin:0;padding:0 16px 14px;color:var(--muted)}
.rate{display:flex;align-items:center;gap:6px;margin-top:30px;padding:14px 18px}
.rate button{border:0;background:none;font-size:1.6rem;line-height:1;filter:grayscale(1);opacity:.5}
.rate button.on{filter:none;opacity:1}
.banner{background:var(--soft);border:2px dashed var(--line);border-radius:12px;padding:8px 14px;margin-bottom:16px;font-size:.9rem;color:var(--muted)}

/* ---------- chat ---------- */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 62px);max-width:820px;margin:0 auto;width:100%;padding:0 20px}
.msgs{flex:1;overflow:auto;padding:24px 0 10px;display:flex;flex-direction:column;gap:14px}
.b{max-width:min(600px,88%);padding:12px 16px;border:2px solid var(--line);border-radius:18px;animation:in .25s;box-shadow:3px 3px 0 var(--line)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.b.bot{background:var(--card);border-bottom-left-radius:4px;align-self:flex-start}
.b.me{background:var(--duck);color:#17160f;border-bottom-right-radius:4px;align-self:flex-end;font-weight:700}
.av{display:flex;gap:10px;align-items:flex-end;align-self:flex-start;max-width:100%}
.av>svg{width:36px;height:36px;flex:none}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0 46px}
.qr button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:2px 2px 0 var(--line)}
.qr button:hover{background:var(--duck);color:#17160f}
.typing span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--muted);animation:t 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes t{50%{transform:translateY(-4px);opacity:.4}}
.mini{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);margin-top:10px}
.compose{display:flex;gap:10px;padding:14px 0 18px}
.compose input{flex:1;border:2px solid var(--line);border-radius:999px;padding:12px 18px;background:var(--card);box-shadow:3px 3px 0 var(--line)}
.compose input:focus{outline:none;box-shadow:4px 4px 0 var(--ink)}
.compose .btn{padding:10px 22px;border-radius:999px}

/* ---------- palette ---------- */
.pal{position:fixed;inset:0;z-index:100;background:#0008;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal.show{display:flex}
.pbox{width:min(640px,94vw);background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:8px 8px 0 #000;overflow:hidden;animation:pop .15s}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.pin{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid var(--line)}
.pin input{flex:1;border:0;outline:0;background:none;font-size:1.15rem}
.pres{max-height:52vh;overflow:auto;padding:8px}
.pres h6{margin:8px 10px 4px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pit{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer}
.pit .ic{font-size:1.3rem;width:28px;text-align:center}
.pit small{color:var(--muted);margin-left:auto}
.pit.sel{background:var(--duck);color:#17160f}.pit.sel small{color:#3b3720}
.pfoot{display:flex;gap:16px;justify-content:center;padding:9px;border-top:2px solid var(--line);color:var(--muted);font-size:.82rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none;font-weight:700}
.toast.show{opacity:1;transform:translateX(-50%)}
.ribbon{position:fixed;left:12px;bottom:12px;z-index:60;background:var(--ink);color:var(--bg);font:800 11px system-ui;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;opacity:.85;pointer-events:none}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:50;left:0;top:0;bottom:0;width:290px;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 0 #0004}
  .side.open{transform:none}
  .burger{display:inline-block}
  .bar{padding:10px 14px}
  .page{padding:20px 14px 50px}
  .helper{flex-wrap:wrap}.helper .btn{margin-left:0}
  .sbtn kbd{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/"><span class="duck" id="logo"></span>iDuckPDF</a>
    <button class="sbtn" id="sb">🔍 <span>Search tools…</span><kbd>Ctrl K</kbd></button>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="bar">
      <button class="ibtn burger" id="burger" aria-label="Menu">☰</button>
      <div class="crumb" id="crumb"></div>
      <button class="ibtn" id="theme" title="Toggle light / dark">🌙</button>
    </header>
    <div id="view"></div>
    <footer class="foot"><a href="#/">Home</a><a href="#/tools">All tools</a><a href="#/chat">Chat helper</a><a href="#/guides">Guides</a><a href="#/about">About</a><span>Files never leave your browser.</span></footer>
  </div>
</div>

<div class="pal" id="pal"><div class="pbox">
  <div class="pin">🔍<input id="pq" placeholder="Search tools, pages, actions…" autocomplete="off"><kbd>Esc</kbd></div>
  <div class="pres" id="pr"></div>
  <div class="pfoot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
</div></div>
<div class="toast" id="toast"></div>
<div class="ribbon">UX preview · tools not wired in this file</div>

<script>
/* ===================== data ===================== */
const DUCK=(s=48)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><g stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 40c0-8 6-12 14-12h6c-2-12 4-20 14-20s14 8 10 16l8 4-8 4c0 12-10 22-24 22-12 0-20-4-20-14z" fill="#ffd23f"/><path d="M44 24l11 4-11 4z" fill="#ff8a1f"/><path d="M18 40c4 6 14 6 18-2" fill="none"/></g><circle cx="43" cy="19" r="2.6" fill="currentColor"/></svg>`;
const CATS=[['ess','Essentials'],['edit','Edit & organize'],['sec','Security & privacy'],['conv','Convert & export'],['ai','Smart tools'],['share','Scan & share']];
// id, icon, name, description, category, live?, keywords
const RAW=[
['merge','🧩','Merge PDF','Combine several PDFs into one. Drag to reorder.','ess',1,'combine join concatenate append'],
['compress','📦','Compress PDF','Make big PDFs small enough to email.','ess',0,'smaller size reduce shrink optimise'],
['split','✂️','Split PDF','Break a PDF into single pages or ranges.','ess',1,'separate extract cut divide pages'],
['pdf-to-jpg','🖼️','PDF to JPG','Turn every page into a crisp image.','ess',0,'image picture png convert export'],
['word-to-pdf','📄','Word to PDF','Convert .doc and .docx to PDF.','ess',0,'docx doc microsoft convert'],
['pdf-to-word','📝','PDF to Word','Get an editable .docx from a PDF.','ess',0,'docx doc editable convert'],
['images-to-pdf','📷','Images to PDF','JPG, PNG and WebP into one PDF.','ess',1,'jpg jpeg png photo picture combine'],
['organize','🗂️','Organize pages','Rotate, delete and reorder in one view.','edit',0,'reorder rearrange sort move'],
['rotate','🔄','Rotate PDF','Turn pages 90, 180 or 270 degrees.','edit',1,'turn flip sideways landscape portrait'],
['remove','🗑️','Remove pages','Delete the pages you do not need.','edit',1,'delete drop discard'],
['crop','📐','Crop & resize','Trim margins or resize to A4 and Letter.','edit',0,'margin trim size a4 letter'],
['watermark','💧','Add watermark','Stamp text or a logo on every page.','edit',0,'stamp draft confidential logo'],
['page-numbers','🔢','Page numbers','Number your pages automatically.','edit',1,'numbering pagination footer'],
['headers','🏷️','Headers & footers','Add custom text at the top or bottom.','edit',0,'header footer date title'],
['extract-text','🔤','Extract text','Copy the text out of a PDF.','edit',0,'copy text txt read'],
['ocr','🔍','OCR','Make scanned PDFs searchable.','edit',0,'scan scanned searchable recognise'],
['encrypt','🔒','Encrypt PDF','Protect a PDF with a password.','sec',0,'password protect lock secure aes'],
['unlock','🔓','Remove password','Unlock a PDF you own.','sec',0,'decrypt password open unlock'],
['redact','⬛','Redact PDF','Permanently black out sensitive info.','sec',0,'blackout hide censor sensitive'],
['flatten','🧱','Flatten PDF','Bake in forms and annotations.','sec',0,'forms annotations fillable lock'],
['privacy','🕵️','Privacy scanner','Find and strip hidden metadata.','sec',0,'metadata author gps exif clean'],
['markdown','📃','Markdown to PDF','Write Markdown, export a clean PDF.','conv',0,'md text document'],
['html','🌐','HTML to PDF','Turn a web page or HTML into PDF.','conv',0,'web page website print'],
['excel','📊','Excel to PDF','Spreadsheets to tidy PDFs.','conv',0,'xlsx xls csv spreadsheet'],
['pdf-to-excel','📈','PDF to Excel','Pull tables out into .xlsx.','conv',0,'xlsx table spreadsheet'],
['pptx','📽️','PowerPoint to PDF','Slides to PDF.','conv',0,'ppt pptx slides presentation'],
['invert','🌗','Invert colours','Dark mode, sepia or grayscale.','conv',0,'dark mode night grayscale sepia'],
['pdf-to-zip','🗜️','PDF to ZIP','Every page as an image in one ZIP.','conv',0,'zip images export archive'],
['chat-pdf','💬','Chat with PDF','Ask questions about your document.','ai',0,'ai ask question gemini'],
['summarize','✨','Summarizer','A quick summary of long PDFs.','ai',0,'tldr summary ai short'],
['compare','🆚','Compare PDFs','See what changed between two files.','ai',0,'diff difference versions'],
['repair','🩹','Repair PDF','Recover a damaged or corrupted file.','ai',0,'fix broken corrupt recover'],
['scan','📱','Scan to PDF','Use your camera as a scanner.','share',0,'camera photo document scanner'],
['p2p','📡','P2P share','Send files browser to browser.','share',0,'send transfer share peer']
];
const TOOLS=RAW.map(([id,icon,name,desc,cat,live,kw])=>({id,icon,name,desc,cat,live:!!live,kw}));
const byId=id=>TOOLS.find(t=>t.id===id);
const catName=c=>CATS.find(x=>x[0]===c)[1];

const OPTS={
  split:`<label>Page ranges <input placeholder="e.g. 1-3, 5, 8-  (blank = one file per page)"></label>`,
  remove:`<label>Pages to remove <input placeholder="e.g. 2, 5-7"></label>`,
  rotate:`<label>Angle <select><option>90° clockwise</option><option>180°</option><option>90° counter-clockwise</option></select></label>`,
  'page-numbers':`<label>Position <select><option>Bottom centre</option><option>Bottom right</option><option>Bottom left</option></select></label>`,
  compress:`<label>Compression level<span class="seg" data-seg><button>Light</button><button class="on">Medium</button><button>Heavy</button></span></label>`,
  watermark:`<label>Watermark text <input value="CONFIDENTIAL"></label><label>Opacity <select><option>30%</option><option>50%</option><option>80%</option></select></label>`,
  'pdf-to-jpg':`<label>Quality <select><option>Standard (150 DPI)</option><option>High (300 DPI)</option><option>Print (600 DPI)</option></select></label>`,
  encrypt:`<label>Password <input type="password" placeholder="Choose a password"></label>`,
  unlock:`<label>Current password <input type="password" placeholder="Enter the password"></label>`,
  crop:`<label>Page size <select><option>Keep original</option><option>A4</option><option>Letter</option></select></label>`
};
const GUIDES=[
 ['How to merge PDFs for free','merge'],['Make a PDF small enough to email','compress'],['Split a long PDF into chapters','split'],
 ['Turn phone photos into one PDF','images-to-pdf'],['Why local PDF tools are safer','privacy'],['Add page numbers in 10 seconds','page-numbers']
];

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toastEl=$('#toast');
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),1800)}
$('#logo').innerHTML=DUCK(34);

/* ===================== theme ===================== */
const root=document.documentElement;
function setTheme(t){root.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('duck-ux-theme',t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem('duck-ux-theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
const toggleTheme=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');
$('#theme').onclick=toggleTheme;

/* ===================== sidebar ===================== */
function buildNav(route){
  const open=new Set(['ess']);
  const cur=route.startsWith('t/')?byId(route.slice(2)):null;
  if(cur)open.add(cur.cat);
  $('#nav').innerHTML=
   `<a class="item ${route===''?'on':''}" href="#/">🏠 Home</a>
    <a class="item ${route==='chat'?'on':''}" href="#/chat">💬 Ask the helper</a>
    <a class="item ${route==='tools'?'on':''}" href="#/tools">🧰 All tools</a>
    <h6>Tools</h6>`+
   CATS.map(([c,n])=>`<details class="cat" ${open.has(c)?'open':''}><summary>${n}</summary><div class="tools">${
     TOOLS.filter(t=>t.cat===c).map(t=>`<a href="#/t/${t.id}" class="${cur&&cur.id===t.id?'on':''}">${t.icon} ${t.name}${t.live?'<span class="pill live">live</span>':''}</a>`).join('')}</div></details>`).join('')+
   `<h6>More</h6>
    <a class="item ${route==='guides'?'on':''}" href="#/guides">📚 Guides</a>
    <a class="item ${route==='about'?'on':''}" href="#/about">🦆 About</a>`;
}

/* ===================== pages ===================== */
const toolCard=(t,sm)=>`<a class="card tool ${sm?'sm':''}" href="#/t/${t.id}"><span class="ic">${t.icon}</span><div><h3>${t.name}</h3><p>${t.desc}</p></div>${t.live?'<span class="pill live">live</span>':''}</a>`;

function pageHome(){
  const live=TOOLS.filter(t=>t.live);
  return `<div class="page">
  <section class="hero">
    <div class="big duck">${DUCK(92)}</div>
    <h1>PDFs, <span class="hl">quacked</span> open.</h1>
    <p class="lead" style="margin-inline:auto">Free. No sign-up. Your files never leave your browser.</p>
    <div class="heroBar" id="hb" role="button" tabindex="0">🔍 <span>What do you want to do?</span><kbd>Ctrl K</kbd></div>
    <div class="hint">Tip: press <kbd>Ctrl</kbd> + <kbd>K</kbd> anywhere to jump to any tool.</div>
  </section>
  <div class="card helper"><div class="em">💬</div><div><h3>Not sure where to start?</h3><p>Tell the helper what you need, in plain words.</p></div><a class="btn" href="#/chat">Ask the helper →</a></div>
  <h2>Ready right now</h2>
  <div class="grid">${live.map(t=>toolCard(t)).join('')}</div>
  ${CATS.map(([c,n])=>`<h2>${n}</h2><div class="grid">${TOOLS.filter(t=>t.cat===c).map(t=>toolCard(t,true)).join('')}</div>`).join('')}
  <h2>Why iDuckPDF?</h2>
  <div class="steps">
    <div class="card step"><b>Private by design</b><p>Everything runs in your browser. Nothing is uploaded.</p></div>
    <div class="card step"><b>No sign-up, no watermark</b><p>Open a tool, use it, done.</p></div>
    <div class="card step"><b>Works offline</b><p>Load the page once and keep going without a connection.</p></div>
  </div></div>`;
}

function pageTools(){
  return `<div class="page"><h1>All <span class="hl">tools</span></h1><p class="lead">${TOOLS.length} tools in ${CATS.length} categories. Green ones are live.</p>
  <div class="chips" style="margin-bottom:8px">${CATS.map(([c,n])=>`<a class="chip" href="#cat-${c}" data-jump="cat-${c}">${n}</a>`).join('')}</div>
  ${CATS.map(([c,n])=>`<h2 id="cat-${c}">${n}</h2><div class="grid">${TOOLS.filter(t=>t.cat===c).map(t=>toolCard(t)).join('')}</div>`).join('')}</div>`;
}

function pageTool(id){
  const t=byId(id);if(!t)return `<div class="page"><h1>Tool not found</h1><a class="btn" href="#/tools">Browse all tools</a></div>`;
  const rel=TOOLS.filter(x=>x.cat===t.cat&&x.id!==t.id).slice(0,4).concat(TOOLS.filter(x=>x.cat!==t.cat&&x.live&&x.id!==t.id).slice(0,2));
  const steps=[['Add your file','Drop it here or tap “Select files”.'],['Choose options','Pick what you need. Defaults are usually right.'],['Download','Get the result instantly. Nothing is uploaded.']];
  const faq=[
   ['Is my file uploaded anywhere?',`No. ${t.name} runs entirely in your browser, so your documents never leave your device.`],
   ['Is it really free?','Yes. No watermark, no sign-up and no daily limits.'],
   ['Does it work offline?','After the page has loaded once, yes.'],
   [t.live?'How big can my files be?':'When will this tool be available?',t.live?'It depends on your device. Big files just take a little longer.':'It is on the list. In this UX preview it is a placeholder so you can judge the layout.']
  ];
  return `<div class="page">
    <div class="banner">${t.live?'✅ This tool already works in the real app.':'🚧 Coming soon: this page is a layout preview.'}</div>
    <h1>${t.icon} ${t.name} <span class="hl">free</span></h1>
    <p class="lead">${t.desc} No sign-up, no watermark.</p>
    <div class="trust"><span>100% free</span><span>No watermark</span><span>No sign-up</span><span>Files stay on your device</span><span>Works offline</span></div>
    <label class="upload" id="up" style="display:block;cursor:pointer"><input type="file" id="fi" multiple hidden>
      <div style="font-size:2.4rem">${t.icon}</div><b style="font-size:1.2rem">Drop files here</b><br><span class="btn">Select files</span></label>
    <ul class="files" id="fl"></ul>
    ${OPTS[t.id]?`<div class="card opts">${OPTS[t.id]}</div>`:''}
    <button class="btn" id="go" disabled>${t.name.replace(' PDF','')} now</button>
    <h2>How to use ${t.name}</h2>
    <div class="steps">${steps.map(s=>`<div class="card step"><b>${s[0]}</b><p>${s[1]}</p></div>`).join('')}</div>
    <h2>Questions</h2>
    ${faq.map(f=>`<details class="faq"><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}
    <h2>Related tools</h2>
    <div class="grid">${rel.map(x=>toolCard(x,true)).join('')}</div>
    <h2>Related guides</h2>
    <div class="chips">${GUIDES.slice(0,3).map(g=>`<a class="chip" href="#/guides">📚 ${g[0]}</a>`).join('')}</div>
    <div class="card rate"><b>Was this helpful?</b> ${[1,2,3,4,5].map(n=>`<button data-r="${n}">⭐</button>`).join('')}<span id="rt" class="hint"></span></div>
  </div>`;
}

function pageGuides(){
  return `<div class="page"><h1><span class="hl">Guides</span> & how-tos</h1><p class="lead">Short, plain-English walkthroughs.</p>
  <div class="grid">${GUIDES.map(g=>{const t=byId(g[1]);return `<a class="card tool" href="#/t/${t.id}"><span class="ic">📚</span><h3>${g[0]}</h3><p>Uses: ${t.icon} ${t.name}</p></a>`}).join('')}</div></div>`;
}
function pageAbout(){
  return `<div class="page"><h1>About <span class="hl">iDuckPDF</span></h1>
  <p class="lead">A free PDF toolbox that runs in your browser. Your files are processed on your own device, so they never touch a server.</p>
  <div class="steps"><div class="card step"><b>Free</b><p>No sign-up, no watermark.</p></div><div class="card step"><b>Private</b><p>Nothing uploaded, ever.</p></div><div class="card step"><b>Quick</b><p>Palette search and a friendly helper get you there fast.</p></div></div>
  <p style="margin-top:24px"><a class="btn" href="#/">Back to the tools</a></p></div>`;
}

/* ===================== chat helper ===================== */
function pageChat(){
  return `<div class="chatwrap"><div class="msgs" id="ms"></div>
  <form class="compose" id="cf"><input id="ci" placeholder="e.g. “I need to combine two PDFs”" autocomplete="off"><button class="btn" type="submit">Send</button></form></div>`;
}
function initChat(){
  const ms=$('#ms'),ci=$('#ci');
  const scroll=()=>{ms.scrollTop=ms.scrollHeight};
  const bot=(html,after)=>{
    const w=document.createElement('div');w.className='av';
    w.innerHTML=`<span class="duck">${DUCK(36)}</span><div class="b bot typing"><span></span><span></span><span></span></div>`;
    ms.append(w);scroll();
    setTimeout(()=>{const b=w.querySelector('.b');b.className='b bot';b.innerHTML=html;scroll();after&&after()},550);
  };
  const me=t=>{const b=document.createElement('div');b.className='b me';b.textContent=t;ms.append(b);scroll()};
  const chips=list=>{const q=document.createElement('div');q.className='qr';
    q.innerHTML=list.map(([l,v])=>`<button data-v="${v}">${l}</button>`).join('');
    q.onclick=e=>{const b=e.target.closest('button');if(!b)return;q.remove();ask(b.textContent,b.dataset.v)};
    ms.append(q);scroll()};
  const starters=()=>chips([['🧩 Combine PDFs','merge'],['✂️ Split a PDF','split'],['📦 Make it smaller','compress'],['📷 Photos to PDF','images-to-pdf'],['🔢 Add page numbers','page-numbers'],['🔒 Add a password','encrypt']]);
  function match(text){
    const STOP=new Set('pdf pdfs page pages file files two need want the and how can make into with this that you your one some please like would could should have help get from for'.split(' '));
    const w=text.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>2&&!STOP.has(x));
    let best=null,bs=0;
    TOOLS.forEach(t=>{const nm=t.name.toLowerCase().split(' '),kws=t.kw.split(' ');let s=0;
      w.forEach(x=>{if(kws.includes(x))s+=4;else if(nm.some(n=>n.startsWith(x)))s+=3;else if(kws.some(k=>k.length>3&&(k.startsWith(x)||x.startsWith(k))))s+=2;else if(t.desc.toLowerCase().includes(x))s+=1});
      if(s>bs){bs=s;best=t}});
    return bs>0?best:null;
  }
  function ask(text,id){
    me(text);
    const t=id?byId(id):match(text);
    if(!t){bot('Hmm, I am not sure which tool that is. Try words like <b>merge</b>, <b>split</b>, <b>compress</b> or <b>password</b>, or pick one:',starters);return}
    bot(`That sounds like <b>${t.icon} ${t.name}</b>. ${esc(t.desc)}${t.live?'':' <i>(Coming soon.)</i>'}<br><div class="mini">Drop your files here</div><div style="margin-top:10px"><a class="btn" href="#/t/${t.id}">Open ${t.name} →</a></div>`,
      ()=>setTimeout(()=>bot('Anything else? Tell me, or tap one:',starters),500));
  }
  $('#cf').onsubmit=e=>{e.preventDefault();const v=ci.value.trim();if(!v)return;ci.value='';ask(v)};
  bot('Hi, I am Duck 🦆 What do you want to do with your PDF today?',starters);
  setTimeout(()=>ci.focus(),100);
}

/* ===================== router ===================== */
function route(){
  const r=location.hash.replace(/^#\/?/,'');
  const v=$('#view');
  let html,crumb;
  if(r==='')                {html=pageHome();crumb='Home'}
  else if(r==='chat')       {html=pageChat();crumb='<a href="#/">Home</a> › Ask the helper'}
  else if(r==='tools')      {html=pageTools();crumb='<a href="#/">Home</a> › All tools'}
  else if(r==='guides')     {html=pageGuides();crumb='<a href="#/">Home</a> › Guides'}
  else if(r==='about')      {html=pageAbout();crumb='<a href="#/">Home</a> › About'}
  else if(r.startsWith('t/')){const t=byId(r.slice(2));html=pageTool(r.slice(2));crumb=`<a href="#/">Home</a> › <a href="#/tools">Tools</a> › ${t?t.name:'?'}`}
  else                      {html=pageHome();crumb='Home'}
  v.innerHTML=html;$('#crumb').innerHTML=crumb;
  buildNav(r);
  document.title=(r===''?'':(r.startsWith('t/')&&byId(r.slice(2))?byId(r.slice(2)).name:r)+' · ')+'iDuckPDF – UX preview';
  $('#side').classList.remove('open');
  window.scrollTo(0,0);
  wire(r);
}
function wire(r){
  if(r==='chat')initChat();
  const hb=$('#hb');if(hb){hb.onclick=()=>openPal();hb.onkeydown=e=>{if(e.key==='Enter')openPal()}}
  document.querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.jump).scrollIntoView({behavior:'smooth'})});
  if(r.startsWith('t/')){
    const fi=$('#fi'),fl=$('#fl'),go=$('#go'),up=$('#up');let files=[];
    const draw=()=>{fl.innerHTML=files.map((f,i)=>`<li>📄 <span>${esc(f.name)}</span><button data-i="${i}" title="Remove">✕</button></li>`).join('');go.disabled=!files.length};
    fi.onchange=e=>{files=files.concat([...e.target.files]);fi.value='';draw()};
    fl.onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){files.splice(+i,1);draw()}};
    ['dragenter','dragover'].forEach(n=>up.addEventListener(n,e=>{e.preventDefault();up.classList.add('over')}));
    ['dragleave','drop'].forEach(n=>up.addEventListener(n,e=>{e.preventDefault();up.classList.remove('over')}));
    up.addEventListener('drop',e=>{files=files.concat([...e.dataTransfer.files]);draw()});
    go.onclick=()=>toast('Preview only: the real tool runs in index.html');
    document.querySelectorAll('[data-seg] button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const n=+b.dataset.r;document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',+x.dataset.r<=n));$('#rt').textContent='Thanks! 🦆'});
  }
}
addEventListener('hashchange',route);
$('#burger').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('click',e=>{if(innerWidth<=860&&!e.target.closest('#side,#burger'))$('#side').classList.remove('open')});

/* ===================== command palette ===================== */
const pal=$('#pal'),pq=$('#pq'),pr=$('#pr');let items=[],sel=0;
const GO=[
  {label:'Home',icon:'🏠',hint:'Page',run:()=>location.hash='#/',kw:'start main'},
  {label:'Ask the helper',icon:'💬',hint:'Page',run:()=>location.hash='#/chat',kw:'chat assistant help'},
  {label:'All tools',icon:'🧰',hint:'Page',run:()=>location.hash='#/tools',kw:'browse list everything'},
  {label:'Guides',icon:'📚',hint:'Page',run:()=>location.hash='#/guides',kw:'help how to blog'},
  {label:'About',icon:'🦆',hint:'Page',run:()=>location.hash='#/about',kw:'info'}
];
const ACT=[{label:'Toggle light / dark theme',icon:'🌗',hint:'Action',run:toggleTheme,kw:'dark mode light theme night'}];
function score(it,q){
  if(!q)return 1;
  const hay=(it.label+' '+(it.kw||'')).toLowerCase(),L=it.label.toLowerCase();
  if(L.startsWith(q))return 100;if(L.includes(q))return 60;
  if(hay.includes(q))return 30;
  let i=0;for(const ch of q){i=L.indexOf(ch,i);if(i<0)return 0;i++}return 5;
}
function renderPal(){
  const q=pq.value.trim().toLowerCase();
  const tools=TOOLS.map(t=>({label:t.name,icon:t.icon,hint:t.live?'Live':catName(t.cat),kw:t.kw+' '+t.desc,run:()=>location.hash='#/t/'+t.id,live:t.live}));
  let groups=[['Go to',GO],['Actions',ACT],['Tools',tools]].map(([n,l])=>[n,l.map(it=>({it,s:score(it,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||(b.it.live?1:0)-(a.it.live?1:0)).map(x=>x.it)]).filter(g=>g[1].length);
  if(!q)groups=groups.map(([n,l])=>[n,n==='Tools'?l.slice(0,8):l]);
  items=groups.flatMap(g=>g[1]);sel=Math.min(sel,Math.max(0,items.length-1));
  let k=0;
  pr.innerHTML=items.length?groups.map(([n,l])=>`<h6>${n}</h6>`+l.map(it=>{const i=k++;return `<div class="pit ${i===sel?'sel':''}" data-i="${i}"><span class="ic">${it.icon}</span>${esc(it.label)}<small>${esc(it.hint)}</small></div>`}).join('')).join(''):`<div class="pit"><span class="ic">🤷</span>Nothing matches “${esc(pq.value)}”. <small>Try the helper</small></div>`;
  const s=pr.querySelector('.sel');s&&s.scrollIntoView({block:'nearest'});
}
function openPal(){pal.classList.add('show');pq.value='';sel=0;renderPal();setTimeout(()=>pq.focus(),0)}
function closePal(){pal.classList.remove('show')}
function runSel(){const it=items[sel];if(!it){location.hash='#/chat';closePal();return}closePal();it.run()}
pq.addEventListener('input',()=>{sel=0;renderPal()});
pr.addEventListener('mousemove',e=>{const el=e.target.closest('.pit[data-i]');if(el&&+el.dataset.i!==sel){sel=+el.dataset.i;renderPal()}});
pr.addEventListener('click',e=>{if(e.target.closest('.pit'))runSel()});
pal.addEventListener('mousedown',e=>{if(e.target===pal)closePal()});
$('#sb').onclick=openPal;
addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.classList.contains('show')?closePal():openPal();return}
  if(pal.classList.contains('show')){
    if(e.key==='Escape'){closePal()}
    else if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(items.length-1,sel+1);renderPal()}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);renderPal()}
    else if(e.key==='Enter'){e.preventDefault();runSel()}
    return;
  }
  if(!typing&&e.key==='/'){e.preventDefault();openPal()}
});

route();
</script>
